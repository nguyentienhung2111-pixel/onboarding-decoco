name: Supabase Keepalive

# Tạo một vài database request mỗi ngày để tránh mức hoạt động quá thấp.
# Cơ chế: mỗi lần chạy sẽ UPSERT 1 dòng vào bảng public.keepalive
# => đây là thao tác ghi thật và không làm tăng số dòng theo thời gian.

on:
  schedule:
    # Chạy 3 lần/ngày; phút 17 tránh khung cao điểm đầu giờ của GitHub Actions.
    - cron: '17 1,9,17 * * *'
  # Cho phép bấm chạy tay từ tab Actions để test.
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase (ghi vào bảng keepalive)
        run: |
          NOW=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          echo "Thời điểm ping (UTC): $NOW"

          STATUS=$(curl -sS --connect-timeout 15 --max-time 60 --retry 2 --retry-all-errors \
            -o /tmp/resp.txt -w "%{http_code}" \
            -X POST "${{ secrets.SUPABASE_URL }}/rest/v1/keepalive" \
            -H "apikey: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Content-Type: application/json" \
            -H "Prefer: resolution=merge-duplicates" \
            -d "[{\"id\": 1, \"last_ping\": \"$NOW\"}]")

          echo "HTTP status: $STATUS"
          cat /tmp/resp.txt

          if [ "$STATUS" -ge 200 ] && [ "$STATUS" -lt 300 ]; then
            echo "Keepalive thanh cong."
          else
            echo "Keepalive that bai (ma $STATUS). Kiem tra lai secrets hoac trang thai project."
            exit 1
          fi
